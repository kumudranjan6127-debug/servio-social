# Keeps GitHub Actions pins and npm dependencies patched automatically.
# Actions are pinned to commit SHAs in the workflows; Dependabot opens PRs that
# bump both the SHA and the trailing `# vX` comment when a new release ships.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
