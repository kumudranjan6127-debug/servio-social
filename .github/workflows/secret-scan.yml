# Defense-in-depth secret scan. Runs the dependency-free scanner over every
# tracked file on each push/PR and weekly. Read-only, no secrets, so it is safe
# even for fork pull requests. Complements GitHub's native secret scanning.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for secrets
        run: node scripts/scan-secrets.mjs --all
