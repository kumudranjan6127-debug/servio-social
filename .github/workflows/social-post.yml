# Daily social post — runs the fully-automatic pipeline (see docs/BUILD.md).
#
# Modes:
#   schedule           -> daily run every morning
#   workflow_dispatch  -> manual run; pick daily / health / week and DRY_RUN
name: Daily social post

on:
  schedule:
    # Review window: the run happens the EVENING BEFORE and SCHEDULES the post
    # for the next 09:00 IST, so it waits in the Buffer dashboard overnight to be
    # reviewed/edited/deleted before it publishes.
    # "30 14 * * *" UTC == 20:00 IST (8 PM). IST is UTC+05:30, no daylight saving.
    # The post is then scheduled by the pipeline for 09:00 IST the next morning.
    # Caveat: GitHub cron is best-effort — under load a run can start late. Safe
    # here: the pipeline writes one record per IST POST date and exits if that
    # date already has a record, so late/duplicate triggers never double-post.
    # (To publish instantly with no review window instead, set REVIEW_WINDOW=false
    # and change this back to "30 3 * * *" = 09:00 IST.)
    - cron: "30 14 * * *"
    # BACKUP RUN — "30 0 * * *" UTC == 06:00 IST. A safety net for when the
    # evening run failed (e.g. a Gemini outage): it targets the SAME morning's
    # 09:00 slot, so if that day already has a post it does nothing, and if it
    # does not it generates one and schedules it for 09:00 (a shorter ~3h review
    # window). The date-keyed idempotency guard makes running both crons safe.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the full pipeline without sending anything to Buffer"
        type: boolean
        default: false
      mode:
        description: "Which flow to run"
        type: choice
        options:
          - daily
          - health
          - week
          - channels
          - models
          - cloudinary
          - gemini-image
        default: daily

# The job commits data/ and logs/ back to the repo, so it needs write access.
permissions:
  contents: write

# Never let two runs overlap (they would race on data/posts.json and the git
# push). A second trigger waits; running posts are never cancelled mid-flight.
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # Optional override of the Gemini model (e.g. if the default 404s for
          # your key). Unset -> env.ts falls back to its default. Empty "" from
          # an unset secret is turned back into unset below.
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # Optional AI image generation. Cloudflare Workers AI (free) is used
          # first when configured, then fal.ai (paid), else the free branded pool.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ secrets.CLOUDFLARE_IMAGE_MODEL }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_IMAGE_MODEL: ${{ secrets.FAL_IMAGE_MODEL }}
          # Scheduled runs have no inputs, so this evaluates to "false" there;
          # manual runs use the checkbox.
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          # Review window on/off. Unset -> on (posts wait in Buffer for review).
          # Set a repo secret/variable REVIEW_WINDOW=false to publish instantly.
          REVIEW_WINDOW: ${{ secrets.REVIEW_WINDOW }}
          # Pass the dispatch input through env rather than interpolating it
          # directly into the run script below — so even if `mode` were ever
          # changed from a fixed `choice` to a free-form string, no value could
          # break out into the shell (defense-in-depth against script injection).
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          # GitHub Actions passes an unset secret as an EMPTY STRING, not as
          # "undefined". The optional NOTIFY_WEBHOOK_URL is validated with
          # z.string().url().optional(), and "" fails .url() — which would crash
          # every run at startup until a webhook (documented as optional) is
          # added. Unsetting the empty vars restores true "not provided" so the
          # optional() branch applies. (CLOUDINARY_* accept "" already, but are
          # unset too for tidiness so imageHostingConfigured stays clean.)
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then unset NOTIFY_WEBHOOK_URL; fi
          if [ -z "$CLOUDINARY_CLOUD_NAME" ]; then unset CLOUDINARY_CLOUD_NAME; fi
          if [ -z "$CLOUDINARY_UPLOAD_PRESET" ]; then unset CLOUDINARY_UPLOAD_PRESET; fi
          if [ -z "$GEMINI_MODEL" ]; then unset GEMINI_MODEL; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then unset CLOUDFLARE_API_TOKEN; fi
          if [ -z "$CLOUDFLARE_IMAGE_MODEL" ]; then unset CLOUDFLARE_IMAGE_MODEL; fi
          if [ -z "$FAL_KEY" ]; then unset FAL_KEY; fi
          if [ -z "$FAL_IMAGE_MODEL" ]; then unset FAL_IMAGE_MODEL; fi
          MODE="${MODE_INPUT:-daily}"
          echo "Running mode: $MODE (DRY_RUN=$DRY_RUN)"
          case "$MODE" in
            channels)     npx tsx src/buffer/getChannels.ts ;;
            models)       npx tsx src/ai/listModels.ts ;;
            gemini-image) npx tsx src/ai/probeImageModels.ts ;;
            cloudinary)   npx tsx src/buffer/testUpload.ts ;;
            health)       npx tsx src/index.ts --health ;;
            week)         npx tsx src/index.ts --week ;;
            *)            npx tsx src/index.ts ;;
          esac

      # Run logs are kept as an EPHEMERAL build artifact instead of being
      # committed. They are useful for debugging a failure, but they contain
      # operational metadata (channel/post ids, image URLs) that need not live
      # permanently in the (public) git history. Retained 14 days, then dropped.
      - name: Upload run logs (ephemeral — not committed to history)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      # data/ IS still committed: posts.json is the pipeline's state (the
      # idempotency guard and dedup history read it on the next run), so it must
      # persist in the repo. It contains only non-secret post content + public
      # ids/URLs. Runs even on failure so partial state is not lost.
      - name: Commit run results (data/) back to the repo
        if: always()
        run: |
          git config user.name "Jayam Srivastava"
          git config user.email "jayamsrivastava99@gmail.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit."
          else
            git commit -m "chore(social): record run output [skip ci]"
            git push
          fi
